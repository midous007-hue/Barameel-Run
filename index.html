<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#062f38">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BARAMEEL RUN</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app" class="app">
  <div id="stage" class="stage" aria-live="polite">
    <img id="screenArt" class="screen-art" src="assets/screens/screen-01.jpg" alt="BARAMEEL RUN screen">
    <div id="characterOverlay" class="character-overlay hidden" aria-hidden="true"></div>
    <div id="cameraLayer" class="camera-layer hidden">
      <video id="camera" autoplay playsinline muted></video>
      <div class="scan-frame"><span></span></div>
      <div class="scan-label">SCAN THE CHECKPOINT</div>
      <button id="demoScan" class="demo-scan">DEMO SCAN</button>
      <button id="closeCamera" class="camera-close">×</button>
    </div>
    <div id="toast" class="toast"></div>
    <div id="tapLayer" class="tap-layer"></div>
  </div>
</div>

<div id="characterModal" class="modal hidden">
  <div class="character-panel">
    <div class="character-title">CHOOSE YOUR RUNNER</div>
    <div class="character-grid" id="characterGrid"></div>
    <button id="characterChoose" class="gold-btn">CHOOSE</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
